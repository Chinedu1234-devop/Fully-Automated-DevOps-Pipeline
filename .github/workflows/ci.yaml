---

name: Complete Devops Project Pipeline

on:
  push:
    branches: 
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set Short SHA
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
      - name: Build Docker Image
        run:
          docker build -t chinedu10/complete-devops-project:${{ env.SHORT_SHA }} .
      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push Dockerhub
        run:
         docker push chinedu10/complete-devops-project:${{ env.SHORT_SHA }}
      - name: Configure Git Author
        run: |
          git config --local user.email "hollow@chinedu10.com"
          git config --local user.name "chinedu10"
      - name: Update Helm Chart with new image tag
        run: |
          sed -i "s/tag:.*/tag: "${{ env.SHORT_SHA }}"/" complete-devops-project-time-printer/values.yaml
          git add ./complete-devops-project-time-printer/values.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          
          



      



      