apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-complete-devops-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Chinedu1234-devop/Fully-Automated-DevOps-Pipeline"
    targetRevision: HEAD
    path: complete-devops-project-time-printer
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    
    